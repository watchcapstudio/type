name: Release

# Builds a signed + notarized universal macOS .dmg and attaches it to a draft
# GitHub Release. Triggered when you push a vX.Y.Z tag, or manually from the
# Actions tab. Requires these repo secrets: CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
# APPLE_TEAM_ID, APPLE_API_KEY (.p8 contents), APPLE_API_KEY_ID, APPLE_API_ISSUER.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Resolve which ref to build
        id: ref
        run: |
          REF="${{ inputs.tag }}"
          [ -z "$REF" ] && REF="${GITHUB_REF#refs/tags/}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Notarization moved from an Apple ID plus app-specific password to an App
      # Store Connect API key when the apps moved to the BTTY LLC team. The key
      # belongs to the team rather than to a person, so it survives someone
      # changing their Apple ID password, and there is no second credential to
      # keep in sync. notarytool wants a file, so the secret is written to one.
      - name: Provide the notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"

      - name: Build signed + notarized universal .dmg
        # Only the API key trio. Passing APPLE_TEAM_ID as well makes
        # @electron/notarize see two credential sets and refuse with "Cannot use
        # password credentials, API key credentials and keychain credentials at
        # once". The signing identity comes from package.json, not from here.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$HOME/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          npm run dist -- --publish never

      - name: Show what was built
        run: |
          ls -lh dist
          # Differential updates silently fall back to the full ZIP when this
          # generated sidecar is missing from a release. Fail before drafting.
          ls -lh dist/*.zip.blockmap

      - name: Attach the .dmg + auto-update manifest to a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          name: type ${{ steps.ref.outputs.tag }}
          draft: true
          # latest-mac.yml = the auto-update manifest electron-updater reads
          # *.zip = the actual update artifact MacUpdater downloads (dmg can't
          # be used for in-place updates on macOS — needs to be a zip of the .app)
          # *.zip.blockmap = the chunk map that lets MacUpdater fetch only the
          # parts of the zip that changed instead of downloading it all
          # *.dmg = first-time downloads from kellyvohs.com/type
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          body: |
            ## type ${{ steps.ref.outputs.tag }}

            A single sheet of paper. Type, then keep it or burn it.

            ### What's new
            - Auto-updates from GitHub Releases — type checks on launch and prompts when a new version is ready
            - Three themes: Light, Amber phosphor, Dispatch
            - Zen mode (fullscreen) and Stay-on-top
            - Smolder: the page chars if you stop typing; cools when you resume. Configurable delay (10 / 30 / 60 / 120s)
            - Burn now with ⌘B
            - First-run onboarding that hands off into an opening quote
            - Quotes on launch and on every burn, with a hover-× to drop one
            - Share a quote as a phone-wallpaper PNG (hover the quote → share icon → AirDrop, Messages, Notes, Mail)
            - Overstrike: ↑ lifts the cursor onto a prior line; x covers a character and advances. ↓ returns to writing.
            - Word count + writing timer
            - Auto-saved drafts survive crashes and restarts
            - Save to a folder of your choice as a dated `.md`
            - Current-line editing: ⌫ char, ⌥⌫ word, ⌘⌫ wipe line. Committed lines stay locked.
